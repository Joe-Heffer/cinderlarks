name: Accessibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Serve the site
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          npx --yes wait-on@8 http://localhost:8000/

      - name: Check accessibility (WCAG 2 AA)
        run: npx --yes pa11y-ci@4 --config .pa11yci.json
