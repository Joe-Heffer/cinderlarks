name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Share the deploy workflow's group: both push to gh-pages, and concurrent pushes
# are rejected with "cannot lock ref" (e.g. merging a PR fires both at once).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
