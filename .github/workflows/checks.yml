name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml --root-dir ${{ github.workspace }} .
          fail: true

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check spelling
        uses: codespell-project/actions-codespell@v2
        with:
          skip: ./.git,./assets/vendor,./assets/images,./assets/fonts

  html-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint HTML
        run: npx --yes htmlhint@1 --config .htmlhintrc index.html

  css-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install stylelint
        run: npm install --no-save stylelint@17 stylelint-config-standard@40 postcss-html@1

      - name: Lint CSS
        run: npx stylelint --config .stylelintrc.json index.html

  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting (.editorconfig)
        uses: editorconfig-checker/action-editorconfig-checker@v2

  unused-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for unreferenced asset files
        run: |
          set -euo pipefail

          # Content assets that should be referenced by filename from somewhere
          # in the site source. assets/vendor is excluded: it's a vendored
          # library (script tag references tailwind.js; LICENSE isn't "used").
          mapfile -t assets < <(git ls-files -- 'assets/images' 'assets/videos' 'assets/fonts' 'favicon.svg')
          mapfile -t sources < <(git ls-files -- '*.html' '*.css' '*.js' '*.json' '*.md')

          unused=()
          for asset in "${assets[@]}"; do
            base=$(basename "$asset")
            if ! grep -qF -- "$base" "${sources[@]}"; then
              unused+=("$asset")
            fi
          done

          if [ "${#unused[@]}" -gt 0 ]; then
            echo "The following asset files aren't referenced anywhere in the site source:"
            printf '  %s\n' "${unused[@]}"
            echo
            echo "Remove them, or reference them, before merging."
            exit 1
          fi

          echo "No unused assets found."
